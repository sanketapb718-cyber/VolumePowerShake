name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          rm -rf appsrc
          mkdir appsrc
          unzip -q VolumePowerShake_Source.zip -d appsrc

      - name: Apply v2 strict wake improvements
        run: |
          cat > appsrc/app/src/main/java/com/sanket/volumepowershake/MainActivity.java <<'EOF_MAIN'
          package com.sanket.volumepowershake;
          
          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.graphics.Color;
          import android.view.View;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.Spinner;
          import android.widget.Switch;
          import android.widget.TextView;
          import android.widget.Toast;
          
          public class MainActivity extends Activity {
          
              public static final String PREFS = "vps_prefs";
              public static final String KEY_SHAKE = "shake_enabled";
              public static final String KEY_VOLUME = "volume_lock_enabled";
              public static final String KEY_SENSITIVITY = "sensitivity";
          
              private SharedPreferences prefs;
              private Switch volumeSwitch;
              private Switch shakeSwitch;
              private Spinner sensitivitySpinner;
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences(PREFS, MODE_PRIVATE);
          
                  if (Build.VERSION.SDK_INT >= 33 &&
                          checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 100);
                  }
          
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(20), dp(24), dp(20), dp(24));
                  root.setBackgroundColor(Color.rgb(18, 18, 18));
          
                  TextView title = text("Volume Power + Shake v2", 26, true);
                  root.addView(title);
          
                  TextView note = text(
                          "\nProtection mode uses a foreground service, a wake-up accelerometer when available, and a CPU wake lock so Shake-to-Wake keeps working more reliably after the screen has been locked for a while.\n\nFor best results, allow unrestricted battery use.",
                          15, false);
                  root.addView(note);
          
                  volumeSwitch = new Switch(this);
                  volumeSwitch.setText("Volume Up = Lock / Wake helper");
                  volumeSwitch.setTextColor(Color.WHITE);
                  volumeSwitch.setTextSize(17);
                  volumeSwitch.setChecked(prefs.getBoolean(KEY_VOLUME, true));
                  root.addView(volumeSwitch, matchWrap());
          
                  Button accessibilityBtn = button("OPEN ACCESSIBILITY SETTINGS");
                  root.addView(accessibilityBtn, matchWrap());
          
                  shakeSwitch = new Switch(this);
                  shakeSwitch.setText("Enable Strict Shake to Wake");
                  shakeSwitch.setTextColor(Color.WHITE);
                  shakeSwitch.setTextSize(17);
                  shakeSwitch.setChecked(prefs.getBoolean(KEY_SHAKE, false));
                  root.addView(shakeSwitch, matchWrap());
          
                  TextView sensLabel = text("\nShake sensitivity", 16, true);
                  root.addView(sensLabel);
          
                  sensitivitySpinner = new Spinner(this);
                  String[] levels = {"High", "Medium", "Low"};
                  ArrayAdapter<String> adapter = new ArrayAdapter<>(
                          this, android.R.layout.simple_spinner_dropdown_item, levels);
                  sensitivitySpinner.setAdapter(adapter);
                  String saved = prefs.getString(KEY_SENSITIVITY, "Medium");
                  sensitivitySpinner.setSelection(saved.equals("High") ? 0 : saved.equals("Low") ? 2 : 1);
                  root.addView(sensitivitySpinner, matchWrap());
          
                  Button batteryBtn = button("ALLOW UNRESTRICTED BATTERY USE");
                  root.addView(batteryBtn, matchWrap());
          
                  Button testBtn = button("TEST: LOCK SCREEN NOW");
                  root.addView(testBtn, matchWrap());
          
                  TextView footer = text(
                          "\nNote: keeping the CPU partially awake improves screen-off shake reliability but uses more battery. Android still may not deliver Volume-button presses while the screen is fully off; that part cannot be guaranteed without system/root privileges.",
                          13, false);
                  footer.setTextColor(Color.LTGRAY);
                  root.addView(footer);
          
                  setContentView(root);
          
                  volumeSwitch.setOnCheckedChangeListener((buttonView, isChecked) -> {
                      prefs.edit().putBoolean(KEY_VOLUME, isChecked).apply();
                  });
          
                  shakeSwitch.setOnCheckedChangeListener((buttonView, isChecked) -> {
                      prefs.edit().putBoolean(KEY_SHAKE, isChecked).apply();
                      if (isChecked) {
                          startShakeService();
                          Toast.makeText(this, "Strict Shake-to-Wake started", Toast.LENGTH_SHORT).show();
                      } else {
                          stopService(new Intent(this, ShakeWakeService.class));
                          Toast.makeText(this, "Shake service stopped", Toast.LENGTH_SHORT).show();
                      }
                  });
          
                  sensitivitySpinner.setOnItemSelectedListener(new android.widget.AdapterView.OnItemSelectedListener() {
                      @Override
                      public void onItemSelected(android.widget.AdapterView<?> parent, View view, int position, long id) {
                          String value = position == 0 ? "High" : position == 2 ? "Low" : "Medium";
                          prefs.edit().putString(KEY_SENSITIVITY, value).apply();
                      }
                      @Override public void onNothingSelected(android.widget.AdapterView<?> parent) {}
                  });
          
                  accessibilityBtn.setOnClickListener(v -> {
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                      Toast.makeText(this, "Enable: Volume Power + Shake", Toast.LENGTH_LONG).show();
                  });
          
                  batteryBtn.setOnClickListener(v -> requestUnrestrictedBattery());
          
                  testBtn.setOnClickListener(v -> {
                      if (VolumeAccessibilityService.instance != null) {
                          VolumeAccessibilityService.instance.lockScreen();
                      } else {
                          Toast.makeText(this, "First enable Accessibility service", Toast.LENGTH_LONG).show();
                      }
                  });
          
                  if (prefs.getBoolean(KEY_SHAKE, false)) startShakeService();
              }
          
              private void requestUnrestrictedBattery() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                          if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                              Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                              i.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(i);
                              return;
                          }
                      }
                      startActivity(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS));
                  } catch (Exception e) {
                      startActivity(new Intent(Settings.ACTION_SETTINGS));
                  }
              }
          
              private void startShakeService() {
                  Intent i = new Intent(this, ShakeWakeService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i);
                  else startService(i);
              }
          
              private TextView text(String s, int sp, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(sp);
                  if (bold) t.setTypeface(null, android.graphics.Typeface.BOLD);
                  return t;
              }
          
              private Button button(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setAllCaps(false);
                  b.setTextSize(15);
                  return b;
              }
          
              private LinearLayout.LayoutParams matchWrap() {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT);
                  p.topMargin = dp(10);
                  return p;
              }
          
              private int dp(int n) {
                  return (int) (n * getResources().getDisplayMetrics().density);
              }
          }
          
          EOF_MAIN
          cat > appsrc/app/src/main/java/com/sanket/volumepowershake/ShakeWakeService.java <<'EOF_SHAKE'
          package com.sanket.volumepowershake;
          
          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.os.SystemClock;
          
          public class ShakeWakeService extends Service implements SensorEventListener {
          
              private static final String CHANNEL_ID = "shake_wake_channel";
              private static final int NOTIFICATION_ID = 9191;
          
              private SensorManager sensorManager;
              private Sensor accelerometer;
              private PowerManager.WakeLock cpuWakeLock;
              private long lastShake = 0L;
          
              @Override
              public void onCreate() {
                  super.onCreate();
                  createChannel();
                  startForeground(NOTIFICATION_ID, buildNotification());
                  holdCpuAwake();
                  registerAccelerometer();
              }
          
              private void holdCpuAwake() {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null) {
                          cpuWakeLock = pm.newWakeLock(
                                  PowerManager.PARTIAL_WAKE_LOCK,
                                  "VolumePowerShake:ShakeCpuLock");
                          cpuWakeLock.setReferenceCounted(false);
                          if (!cpuWakeLock.isHeld()) cpuWakeLock.acquire();
                      }
                  } catch (Exception ignored) {}
              }
          
              private void registerAccelerometer() {
                  sensorManager = (SensorManager) getSystemService(Context.SENSOR_SERVICE);
                  if (sensorManager == null) return;
          
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      accelerometer = sensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER, true);
                  }
                  if (accelerometer == null) {
                      accelerometer = sensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);
                  }
          
                  if (accelerometer != null) {
                      sensorManager.unregisterListener(this);
                      sensorManager.registerListener(
                              this,
                              accelerometer,
                              SensorManager.SENSOR_DELAY_GAME,
                              0);
                  }
              }
          
              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  SharedPreferences prefs = getSharedPreferences(MainActivity.PREFS, MODE_PRIVATE);
                  if (!prefs.getBoolean(MainActivity.KEY_SHAKE, false)) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
          
                  if (cpuWakeLock == null || !cpuWakeLock.isHeld()) holdCpuAwake();
                  if (accelerometer == null) registerAccelerometer();
                  return START_STICKY;
              }
          
              private Notification buildNotification() {
                  Intent open = new Intent(this, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(
                          this, 0, open,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
          
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26
                          ? new Notification.Builder(this, CHANNEL_ID)
                          : new Notification.Builder(this);
          
                  return b.setContentTitle("Shake to Wake active")
                          .setContentText("Protection mode is keeping shake detection active")
                          .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                          .setContentIntent(pi)
                          .setOngoing(true)
                          .setCategory(Notification.CATEGORY_SERVICE)
                          .build();
              }
          
              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "Shake to Wake",
                              NotificationManager.IMPORTANCE_LOW);
                      channel.setDescription("Keeps shake-to-wake detection active");
                      channel.setShowBadge(false);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(channel);
                  }
              }
          
              @Override
              public void onSensorChanged(SensorEvent event) {
                  if (event.sensor.getType() != Sensor.TYPE_ACCELEROMETER) return;
          
                  float x = event.values[0];
                  float y = event.values[1];
                  float z = event.values[2];
          
                  float gX = x / SensorManager.GRAVITY_EARTH;
                  float gY = y / SensorManager.GRAVITY_EARTH;
                  float gZ = z / SensorManager.GRAVITY_EARTH;
                  float gForce = (float) Math.sqrt(gX * gX + gY * gY + gZ * gZ);
          
                  SharedPreferences prefs = getSharedPreferences(MainActivity.PREFS, MODE_PRIVATE);
                  String sensitivity = prefs.getString(MainActivity.KEY_SENSITIVITY, "Medium");
                  float threshold = sensitivity.equals("High") ? 1.65f :
                                    sensitivity.equals("Low") ? 2.65f : 2.15f;
          
                  long now = System.currentTimeMillis();
                  if (gForce >= threshold && now - lastShake > 1100) {
                      lastShake = now;
                      wakeIfSleeping();
                  }
              }
          
              @SuppressWarnings("deprecation")
              private void wakeIfSleeping() {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null && !pm.isInteractive()) {
                          PowerManager.WakeLock screenLock = pm.newWakeLock(
                                  PowerManager.SCREEN_BRIGHT_WAKE_LOCK |
                                  PowerManager.ACQUIRE_CAUSES_WAKEUP,
                                  "VolumePowerShake:ScreenWake");
                          screenLock.setReferenceCounted(false);
                          screenLock.acquire(3500);
                      }
                  } catch (Exception ignored) {}
              }
          
              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  try {
                      SharedPreferences prefs = getSharedPreferences(MainActivity.PREFS, MODE_PRIVATE);
                      if (prefs.getBoolean(MainActivity.KEY_SHAKE, false)) {
                          Intent restart = new Intent(getApplicationContext(), ShakeWakeService.class);
                          PendingIntent pi = PendingIntent.getService(
                                  getApplicationContext(),
                                  9192,
                                  restart,
                                  PendingIntent.FLAG_ONE_SHOT | PendingIntent.FLAG_IMMUTABLE);
          
                          AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                          if (am != null) {
                              long when = SystemClock.elapsedRealtime() + 2500L;
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  am.setAndAllowWhileIdle(AlarmManager.ELAPSED_REALTIME_WAKEUP, when, pi);
                              } else {
                                  am.set(AlarmManager.ELAPSED_REALTIME_WAKEUP, when, pi);
                              }
                          }
                      }
                  } catch (Exception ignored) {}
                  super.onTaskRemoved(rootIntent);
              }
          
              @Override public void onAccuracyChanged(Sensor sensor, int accuracy) {}
          
              @Override
              public void onDestroy() {
                  if (sensorManager != null) sensorManager.unregisterListener(this);
                  try {
                      if (cpuWakeLock != null && cpuWakeLock.isHeld()) cpuWakeLock.release();
                  } catch (Exception ignored) {}
                  super.onDestroy();
              }
          
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          
          EOF_SHAKE
          cat > appsrc/app/src/main/AndroidManifest.xml <<'EOF_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
          
              <application
                  android:allowBackup="true"
                  android:label="Volume Power + Shake"
                  android:theme="@style/AppTheme">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <service
                      android:name=".ShakeWakeService"
                      android:exported="false"
                      android:stopWithTask="false" />
          
                  <service
                      android:name=".VolumeAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
          
                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
          
              </application>
          </manifest>
          
          EOF_MANIFEST
          sed -i 's/versionCode 1/versionCode 2/' appsrc/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.0"/' appsrc/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses and install SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: appsrc
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VolumePowerShake-v2-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
